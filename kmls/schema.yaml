version: 1
description: "KML 户外路线收藏库规范：仅保留路线几何（LineString）与 POI 点位（Point），自动剥离所有图片与冗余样式。"

categories:
  offroad:
    label: "越野穿越"
    color: "#E85D04"
    line_width: 3.5
    sub_types: ["穿越", "无人区", "沙漠", "林道", "涉水", "冰雪"]
    difficulty_levels: ["素车可过", "轻度改装", "重度改装", "极限探险"]
  cycling:
    label: "自行车"
    color: "#0EA5E9"
    line_width: 3.0
    sub_types: ["公路", "山地XC", "砾石Gravel", "绿道", "长途"]
    difficulty_levels: ["休闲", "进阶", "挑战", "虐线"]
  hiking:
    label: "徒步"
    color: "#16A34A"
    line_width: 2.5
    sub_types: ["轻徒步", "重装", "古道", "高海拔", "环线"]
    difficulty_levels: ["1星-入门", "2星-初级", "3星-进阶", "4星-高难", "5星-极限"]

